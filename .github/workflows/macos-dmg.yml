name: Desktop Patch

on:
  push:
    branches-ignore:
      - 'skip-ci-*'
      - 'contrib/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Patch (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-macos
            runner: macos-26
          - platform: x86_64-macos
            runner: macos-26-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Same setup-java SemVer as main-ci.yml. The bundle script downloads
          # the runtime separately using VERSION_EDITOR_JDK's release-tag syntax.
          java-version: '25.0.4+101.0.LTS'
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.3.2
      - name: Cache downloaded dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.dcache
            editor/.m2/repository
            editor/build/lein
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: macos-dmg-${{ matrix.platform }}-${{ hashFiles('build_tools/sdk.py', 'editor/project.clj', 'editor/scripts/lein', '**/*.gradle', '**/gradle-wrapper.properties') }}
      - name: Test patch packaging
        run: python3 -m unittest discover -s patch -p 'test_*.py'
      - name: Build engine, Bob and editor patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp
          bash scripts/macos/build-patch.sh '${{ matrix.platform }}' 2>&1 | tee tmp/macos-patch.log
      - name: Test updater, panel layout and GUI animation
        run: |
          source tmp/macos-build-env.sh
          cd editor
          # Release AOT uses direct linking, which bypasses the with-redefs
          # boundaries in editor tests. Retain the release output, then test sources.
          mv target/classes target/release-classes
          LEIN_HOME="$PWD/build/lein" bash scripts/lein do javac, test \
            editor.patch-test editor.docking-test editor.dock-windows-test editor.game-preview-test editor.engine-game-test \
            editor.gui-animation-data-test editor.gui-animation-features-test editor.gui-animation-io-test \
            editor.gui-animation-timeline-test editor.gui-animation-preview-test \
            editor.gui-animation-events-test editor.gui-animation-inspector-test \
            editor.scene-tools-animation-test editor.scene-test editor.ui-test integration.gui-animation-test \
            editor.craft-binding-test editor.app-view-photocraft-test editor.craft-publish-test \
            integration.craft-project-test integration.craft-publish-test \
            editor.code.insight-test editor.lsp.defold-lua-test integration.lsp-test
      - name: Test EmmyLua backend and editor protocol adapter
        run: |
          source tmp/macos-build-env.sh
          cd editor
          LEIN_HOME="$PWD/build/lein" bash scripts/lein with-profile +offline classpath > ../tmp/emmy-test-classpath.txt
          python3.12 scripts/test_emmylua.py --server "resources/_unpack/${{ matrix.platform }}/bin/lsp/emmylua/emmylua_ls" --bridge-classpath ../tmp/emmy-test-classpath.txt
      - name: Test exported GUI animations in the game runtime
        run: |
          source tmp/macos-build-env.sh
          python3.12 editor/test/resources/gui_animation_runtime_project/run.py \
            --bob "$DYNAMO_HOME/share/java/bob.jar" \
            --engine "$DYNAMO_HOME/bin/${{ matrix.platform }}/dmengine_headless" \
            --platform '${{ matrix.platform }}' \
            --output tmp/gui-animation-runtime --repeat 2
      - name: Upload game runtime regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-animation-runtime-${{ matrix.platform }}
          path: tmp/gui-animation-runtime
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload patch and baseline inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Defold-${{ matrix.platform }}-${{ github.sha }}
          path: |
            editor/target/editor/Defold-${{ matrix.platform }}-patch-*-to-*.zip
            editor/target/editor/Defold-${{ matrix.platform }}-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ matrix.platform }}
          path: tmp/macos-patch.log
          retention-days: 7

  build-windows:
    name: Patch (x86_64-win32)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.dcache
            editor/.m2/repository
            editor/build/lein
          key: windows-patch-${{ hashFiles('editor/project.clj', 'editor/scripts/lein') }}
      - name: Test patch packaging
        run: python -X utf8 -m unittest discover -s patch -p 'test_*.py'
      - name: Build and verify Windows patch resources and cache upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 scripts/windows/build-patch.py
      - name: Test Windows installation and restart
        shell: pwsh
        run: |
          python -X utf8 -c "import pathlib,zipfile; p=next(pathlib.Path('editor/target/editor').glob('Defold-x86_64-win32-patch-*.zip')); z=zipfile.ZipFile(p); n=next(n for n in z.namelist() if n.startswith('files/packages/defold-') and n.endswith('.jar')); pathlib.Path('tmp/windows-test-editor.jar').write_bytes(z.read(n))"
          $env:DEFOLD_PATCH_TEST_JAR = "$PWD/tmp/windows-test-editor.jar"
          python -X utf8 -m unittest discover -s patch -p 'test_windows.py'
      - name: Test Windows panel drag and redocking events
        shell: bash
        run: |
          python -X utf8 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path.cwd()
          editor = root / 'editor'
          shutil.move(editor / 'target/classes', editor / 'target/release-classes')
          env = dict(os.environ, DYNAMO_HOME=str(root / 'tmp/windows-patch-home'),
                     DM_BOB_JAR=str(root / 'tmp/windows-patch-home/share/java/bob-editor.jar'),
                     DM_EDITOR_USE_BOB_PROTOCOLS='1', LEIN_HOME=str(editor / 'build/lein'))
          code = "(javafx.application.Platform/startup (fn [] (javafx.application.Platform/setImplicitExit false))) (require 'editor.docking-test 'editor.dock-windows-test 'editor.game-preview-test 'editor.code.insight-test 'editor.lsp.defold-lua-test) (let [r (clojure.test/run-tests 'editor.docking-test 'editor.dock-windows-test 'editor.game-preview-test 'editor.code.insight-test 'editor.lsp.defold-lua-test)] (System/exit (if (zero? (+ (:fail r) (:error r))) 0 1)))"
          subprocess.run(['bash', 'scripts/lein', 'with-profile', '+offline', 'run',
                          '-m', 'clojure.main', '-e', code], cwd=editor, env=env, check=True)
          with (root / 'tmp/emmy-test-classpath.txt').open('w') as output:
              subprocess.run(['bash', 'scripts/lein', 'with-profile', '+offline', 'classpath'], cwd=editor, env=env, stdout=output, check=True)
          subprocess.run(['python', '-X', 'utf8', 'scripts/test_emmylua.py', '--server',
                          'resources/_unpack/x86_64-win32/bin/lsp/emmylua/emmylua_ls.exe',
                          '--bridge-classpath', '../tmp/emmy-test-classpath.txt'], cwd=editor, env=env, check=True)
          PY
      - name: Upload patch and baseline inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Defold-x86_64-win32-${{ github.sha }}
          path: |
            editor/target/editor/Defold-x86_64-win32-patch-*-to-*.zip
            editor/target/editor/Defold-x86_64-win32-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-patch:
    name: Publish branch patch
    needs: [build, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/editor-docking-patch4' && github.repository == 'iricwang/defold'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Defold-*-${{ github.sha }}
          path: tmp/patch-release
          merge-multiple: true
      - name: Publish packages and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: python3 patch/manage.py publish --directory tmp/patch-release --commit "$BUILD_SHA"
