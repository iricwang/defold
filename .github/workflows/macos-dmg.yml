name: macOS DMG

on:
  push:
    branches-ignore:
      - 'skip-ci-*'
      - 'contrib/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: DMG (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-macos
            runner: macos-26
          - platform: x86_64-macos
            runner: macos-26-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Same setup-java SemVer as main-ci.yml. The bundle script downloads
          # the runtime separately using VERSION_EDITOR_JDK's release-tag syntax.
          java-version: '25.0.4+101.0.LTS'
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.3.2
      - name: Cache downloaded dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.dcache
            editor/.m2/repository
            editor/build/lein
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: macos-dmg-${{ matrix.platform }}-${{ hashFiles('build_tools/sdk.py', 'editor/project.clj', 'editor/scripts/lein', '**/*.gradle', '**/gradle-wrapper.properties') }}
      - name: Test patch packaging
        run: python3 -m unittest discover -s patch -p 'test_*.py'
      - name: Build engine, Bob, editor and verify DMG
        run: |
          mkdir -p tmp
          bash scripts/macos/build-dmg.sh '${{ matrix.platform }}' 2>&1 | tee tmp/macos-dmg.log
      - name: Test incremental updater and panel layout
        run: |
          source tmp/macos-build-env.sh
          cd editor
          LEIN_HOME="$PWD/build/lein" bash scripts/lein test editor.patch-test editor.docking-test
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Defold-${{ matrix.platform }}-${{ github.sha }}
          path: |
            editor/target/editor/Defold-${{ matrix.platform }}.dmg
            editor/target/editor/Defold-${{ matrix.platform }}.dmg.sha256
            editor/target/editor/Defold-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ matrix.platform }}
          path: tmp/macos-dmg.log
          retention-days: 7

  publish-patch:
    name: Publish dev patch
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'iricwang/defold'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Defold-*-macos-${{ github.sha }}
          path: tmp/patch-release
          merge-multiple: true
      - name: Publish packages and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: python3 patch/manage.py publish --directory tmp/patch-release --commit "$BUILD_SHA"
