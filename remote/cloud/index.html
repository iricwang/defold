<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,viewport-fit=cover,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https: wss:; media-src blob:; img-src 'self' data:"><title>Defold Remote</title><link rel="stylesheet" href="remote.css"></head><body>
<svg class="symbols" aria-hidden="true"><defs><symbol id="icon-wifi" viewBox="0 0 24 24"><path d="M4.2 7.2a11 11 0 0 1 15.6 0M7.1 11.1a7 7 0 0 1 9.8 0M9.9 15a3 3 0 0 1 4.2 0"/><circle cx="12" cy="20" r=".7"/></symbol><symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18C1 18 1 10 6 10C6 2 18 2 18 10C24 10 24 18 18 18Z"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="icon-game" viewBox="0 0 24 24"><path d="M6 7h12l4 11-4 2-4-4h-4l-4 4-4-2ZM7 10v5m-2.5-2.5h5"/><circle cx="16" cy="11" r=".7"/><circle cx="18" cy="14" r=".7"/></symbol><symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3-10 5 10 5 10-5Zm-10 9 10 5 10-5M2 16l10 5 10-5"/></symbol><symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4M8 21h8"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6"/></symbol></defs></svg>
<video id="video" autoplay playsinline muted disablepictureinpicture disableremoteplayback></video><div id="audio" hidden></div>
<div id="first-frame" hidden role="status"><i aria-hidden="true"></i><span id="load-label">正在接收画面…</span></div>
<div id="orb-area"><button id="preview-menu" aria-controls="controls" aria-expanded="false" aria-label="预览控制" hidden><span aria-hidden="true"></span></button></div>
<main id="panel">
<header class="toolbar">
<button id="choose-computer" aria-haspopup="dialog"><strong id="host-name">选择电脑</strong><span id="host-status">未连接</span><svg class="chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
<button id="lan-mode" class="route-button" aria-label="服务器 · 切换到 Wi-Fi" title="服务器 · 切换到 Wi-Fi"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h1m-1 11h1"/></svg></button>
<button id="add-computer" class="icon-button" aria-label="添加电脑" title="添加电脑"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-plus"/></svg></button></header>
<div class="content"><p id="preview-message" role="status" hidden></p>
<section id="catalog"><div class="title-row"><h2 id="section-title">你的游戏</h2></div><input id="search" type="search" placeholder="搜索游戏或电脑" aria-label="搜索游戏或电脑"><p id="message" role="status"></p><div id="games"></div><section id="settings" hidden>
<h3 class="settings-label">游戏预览</h3>
<div class="settings-group">
<button id="quality-setting" class="setting-row quality-setting" aria-haspopup="dialog"><span>预览清晰度</span><span id="quality-value"></span><i class="row-arrow" aria-hidden="true"></i></button>
<button id="awake-setting" class="setting-row" role="switch" aria-checked="true" hidden><span>屏幕常亮</span><i class="toggle" aria-hidden="true"></i></button>
</div>
<h3 class="settings-label">连接</h3>
<div class="settings-group">
<button id="account" class="setting-row"><span>账号与连接</span><i class="row-arrow" aria-hidden="true"></i></button>
<button id="refresh" class="setting-row"><span>刷新电脑</span><i class="row-arrow" aria-hidden="true"></i></button>
<button id="logout" class="setting-row"><span>退出账号</span><i class="row-arrow" aria-hidden="true"></i></button>
</div></section></section>
<section id="controls" aria-label="预览控制" hidden><div class="preview-tools"><button id="quality-preview" aria-haspopup="dialog" aria-label="预览清晰度"></button><small id="stream-dimensions"></small><button id="resume" aria-label="收起控制">收起</button></div><div class="preview-actions"><button id="leave">返回项目</button><button id="stop">停止游戏</button></div></section></div>
<nav class="bottom-tabs" aria-label="主导航"><button data-page="games" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-game"/></svg><span>游戏</span></button><button data-page="settings" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-settings"/></svg><span>设置</span></button></nav></main>
<dialog id="connection-dialog"><header><h2 id="connection-title">登录服务器</h2><button class="icon-button" data-dismiss aria-label="关闭"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-close"/></svg></button></header><p id="connection-message" role="status"></p>
<button id="scan-pair" class="primary">扫描电脑二维码</button><form id="login"><label>服务器<input id="server" value="https://120.48.110.91" type="url" required></label><label>账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button></form>
<section id="authorization" hidden><p class="muted">粘贴电脑端“公网连接”生成的邀请。</p><textarea id="invitation" rows="3" aria-label="设备邀请"></textarea><button id="claim" class="primary">添加电脑</button></section></dialog>
<dialog id="computer-dialog"><header><h2>选择电脑</h2><button class="icon-button" data-dismiss aria-label="关闭"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-close"/></svg></button></header><div id="computer-options"></div><button id="picker-add">添加电脑</button></dialog>
<dialog id="quality-dialog" aria-labelledby="quality-title"><header><h2 id="quality-title">串流分辨率</h2><button class="icon-button" data-dismiss aria-label="关闭"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-close"/></svg></button></header><div id="quality-options"></div></dialog>
<script src="livekit-client.umd.min.js"></script><script src="remote.js"></script><script src="remote-orb.js"></script></body></html>
