<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https: wss:; media-src blob:; img-src 'self' data:"><title>Defold Remote</title><link rel="stylesheet" href="remote.css"></head><body>
<svg class="symbols" aria-hidden="true"><defs><symbol id="icon-wifi" viewBox="0 0 24 24"><path d="M4.2 7.2a11 11 0 0 1 15.6 0M7.1 11.1a7 7 0 0 1 9.8 0M9.9 15a3 3 0 0 1 4.2 0"/><circle cx="12" cy="20" r=".7"/></symbol><symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18C1 18 1 10 6 10C6 2 18 2 18 10C24 10 24 18 18 18Z"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="icon-game" viewBox="0 0 24 24"><path d="M6 7h12l4 11-4 2-4-4h-4l-4 4-4-2ZM7 10v5m-2.5-2.5h5"/><circle cx="16" cy="11" r=".7"/><circle cx="18" cy="14" r=".7"/></symbol><symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3-10 5 10 5 10-5Zm-10 9 10 5 10-5M2 16l10 5 10-5"/></symbol><symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4M8 21h8"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6"/></symbol></defs></svg>
<video id="video" autoplay playsinline muted></video><div id="audio"></div>
<main id="panel">
<header class="toolbar"><span id="page-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-game"/></svg></span><div class="page-label"><h1 id="page-title">游戏</h1><span id="subtitle">服务器</span></div><nav class="transport-tabs" aria-label="连接方式"><button id="lan-mode" aria-label="局域网" title="局域网" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-wifi"/></svg></button><button id="server-mode" aria-label="服务器" title="服务器" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-cloud"/></svg></button></nav><button id="add-computer" class="icon-button" aria-label="添加电脑" title="添加电脑"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-plus"/></svg></button></header>
<div class="content"><p id="message" role="status"></p>
<section id="catalog"><div class="title-row"><h2 id="section-title">你的游戏</h2><button id="choose-computer" class="filter">选择电脑 ▾</button></div><input id="search" type="search" placeholder="搜索游戏或电脑" aria-label="搜索游戏或电脑"><div id="games"></div><div id="hosts" hidden></div><section id="settings" hidden><label class="quality-row">预览清晰度<select id="quality-setting" aria-label="默认预览清晰度"><option value="540p">540p · 流畅</option><option value="720p">720p · 均衡</option><option value="1080p">1080p · 清晰</option></select></label><p class="muted quality-hint">仅调整传输画面，不改变游戏适配尺寸。</p><button id="account">账号与连接</button><button id="refresh">刷新电脑</button><button id="logout">退出账号</button></section></section>
<section id="controls" hidden><h2>预览控制</h2><p id="dimensions"></p><label class="quality-row">预览清晰度<select id="quality-preview" aria-label="游戏预览清晰度"><option value="540p">540p · 流畅</option><option value="720p">720p · 均衡</option><option value="1080p">1080p · 清晰</option></select></label><p id="stream-dimensions" class="muted" role="status"></p><button id="resume" class="primary">继续预览</button><button id="leave">返回项目</button><button id="stop">停止游戏</button></section></div>
<nav class="bottom-tabs" aria-label="主导航"><button data-page="games" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-game"/></svg><span>游戏</span></button><button data-page="running" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-layers"/></svg><span>运行中</span></button><button data-page="computers" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-monitor"/></svg><span>电脑</span></button><button data-page="settings" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-settings"/></svg><span>设置</span></button></nav></main>
<dialog id="connection-dialog"><header><h2 id="connection-title">登录服务器</h2><button class="icon-button" data-dismiss aria-label="关闭"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-close"/></svg></button></header><p id="connection-message" role="status"></p>
<form id="login"><label>服务器<input id="server" value="https://120.48.110.91" type="url" required></label><label>账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button></form>
<section id="authorization" hidden><p class="muted">粘贴电脑端“公网连接”生成的邀请。</p><textarea id="invitation" rows="3" aria-label="设备邀请"></textarea><button id="claim" class="primary">添加电脑</button></section></dialog>
<dialog id="computer-dialog"><header><h2>选择电脑</h2><button class="icon-button" data-dismiss aria-label="关闭"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-close"/></svg></button></header><div id="computer-options"></div><button id="picker-add">添加电脑</button></dialog>
<script src="livekit-client.umd.min.js"></script><script src="remote.js"></script></body></html>
