[package]
name = "defold-remote-transport"
version = "0.1.0"
edition = "2021"
[dependencies]
livekit = { version = "=0.11.0", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde_json = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
[profile.release]
opt-level = "s"
strip = true
