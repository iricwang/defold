<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defold Remote Manager</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand"><span class="mark">D</span><div>Defold Remote<small>Manager</small></div></div><nav aria-label="主导航"><button data-page="projects" class="active">▦ <span>游戏项目</span><b id="project-count">0</b></button><button data-page="running">▷ <span>正在运行</span><b id="running-count">0</b></button><button data-page="devices">▣ <span>已配对设备</span></button><button data-page="settings">⚙ <span>设置</span></button></nav><div class="host"><i id="service-dot"></i><strong id="computer">连接后台服务…</strong><small id="host-address">本机运行 · 局域网连接</small></div><button id="hide" class="quiet">收起到托盘</button></aside>
