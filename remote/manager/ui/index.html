<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Defold Remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-bar">
    <strong class="brand">Defold <span>Remote</span></strong>
    <nav aria-label="主导航">
      <button data-page="projects" class="active">项目 <b id="project-count">0</b></button>
      <button data-page="running">运行中 <b id="running-count">0</b></button>
      <button data-page="devices">设备</button>
      <button data-page="settings">设置</button>
    </nav>
  </div>
  <main>
    <header>
      <div><h1 id="page-title">游戏项目</h1><p id="page-caption" hidden></p></div>
      <div class="actions"><button id="pair">连接手机</button><button id="add" class="primary">＋ 添加项目</button></div>
    </header>
    <div id="notice" role="status" hidden></div>
    <section id="content" aria-label="当前页面"></section>
  </main>
  <footer>
    <span class="host"><i id="service-dot" aria-hidden="true"></i><span id="computer">正在连接…</span><span id="host-address" hidden></span></span>
    <span id="summary">正在获取状态</span>
    <button id="hide" class="quiet" title="收起窗口，游戏继续运行">收起到托盘</button>
  </footer>
  <dialog id="dialog" aria-label="Remote 操作"><div id="dialog-content"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
